name: Deploy to O2Switch

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          
      - name: Install Dependencies
        run: |
          npm install --prefix backend
          npm install --prefix frontend
          
      - name: Run Tests
        run: npm run test:ci

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Debloquer le pare-feu O2Switch (Whitelist IP)
        run: |
          echo "Recuperation de l'IP publique du runner..."
          MY_IP=$(curl -s https://api.ipify.org)
          echo "IP du runner: $MY_IP"
          echo "Envoi de la requete de whitelist a O2Switch..."
          curl -sk "https://${{ secrets.O2SWITCH_USER }}:${{ secrets.CPANEL_PASSWORD }}@${{ secrets.O2SWITCH_HOST }}:2083/frontend/o2switch/o2switch-ssh-whitelist/index.live.php"
          echo "Attente de 15 secondes pour la propagation du pare-feu..."
          sleep 15
          
      - name: Deploy Frontend via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist/*"
          target: "/home/${{ secrets.O2SWITCH_USER }}/ngnipicba/edusmart/frontend"
          strip_components: 2
          
      - name: Deploy Backend via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/*"
          target: "/home/${{ secrets.O2SWITCH_USER }}/ngnipicba/edusmart/backend"
          strip_components: 1
          
      - name: Configure Backend et Redemarrer via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.O2SWITCH_USER }}/ngnipicba/edusmart/backend

            cat > .env << 'EOF'
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            PORT=4000
            EOF

            npm install --production
            mkdir -p tmp
            touch tmp/restart.txt

