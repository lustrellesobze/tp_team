name: Deploy to O2Switch

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          
      - name: Install Dependencies
        run: |
          npm install --prefix backend
          npm install --prefix frontend
          
      - name: Run Tests
        run: npm run test:ci

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Prepare Backend (.env & node_modules)
        run: |
          cd backend
          npm install --production
          
          # Generation du fichier .env
          cat > .env << 'EOF'
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          PORT=4000
          EOF
          
          # Generation du fichier de redemarrage (utilise par Passenger sur O2Switch)
          mkdir -p tmp
          touch tmp/restart.txt
          
      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ./ngnipicba/edusmart/frontend/
          
      - name: Deploy Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          local-dir: ./backend/
          server-dir: ./ngnipicba/edusmart/backend/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

